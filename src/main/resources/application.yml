spring:
  application:
    name: tourpackage-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourpackage}
    username: ${DB_USERNAME:tourpackage}
    password: ${DB_PASSWORD:tourpackage}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # How close a typo has to be before global search treats it as a match,
      # applied once per physical connection. PostgreSQL's default is 0.6, which
      # rejects a single dropped letter in a short word: word_similarity between
      # "tropcal" and "Bali Tropical Retreat" is 0.545. Measured on 200k
      # synthetic rows, 0.5 recovers exactly the rows that genuinely contain the
      # word and no others, and the trigram index still serves it as a bitmap
      # index scan. Set here rather than in a migration because it is runtime
      # tuning, not schema — a migration would change the setting for every
      # other connection to the database too.
      connection-init-sql: SET pg_trgm.word_similarity_threshold = ${SEARCH_FUZZY_THRESHOLD:0.5}

  # Only contacted when CACHE_STORE or RATE_LIMIT_STORE is `redis`; the
  # auto-configuration does not open a connection until something asks for one.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # Spring's defaults are 1MB per file / 10MB per request, which would
      # reject uploads before ImageProcessor's own limit ever ran. Kept a
      # little above app.storage.image.max-upload-bytes so the app's error
      # message is what the user sees, not a container-level failure.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:120MB}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  api:
    version: ${API_VERSION:1.0.0}
    # Used as the server URL in the OpenAPI document.
    public-url: ${API_PUBLIC_URL:http://localhost:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # `memory` counts per instance; `redis` shares the count across a fleet.
    store: ${RATE_LIMIT_STORE:memory}
    # Only enable behind a proxy that overwrites X-Forwarded-For. The header is
    # client-settable, so trusting it without one lets any caller bypass every
    # limit by varying it per request.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_PROXY:false}
  cache:
    store: ${CACHE_STORE:memory}
    ttl-seconds: ${CACHE_TTL_SECONDS:60}
  observability:
    slow-request-ms: ${SLOW_REQUEST_MS:1000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
  mail:
    # Turns delivery off without removing the SMTP settings — useful for a demo
    # or a load test that shouldn't mail real people. Messages are logged instead.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:100sky.ladakh@gmail.com}
    # Shown as the sender name, and used across the templates as the brand.
    from-name: ${MAIL_FROM_NAME:Tour Leh Ladakh}
    # Where "a booking came in"/enquiry notifications go. Separate from `from` so
    # a real deployment can route them to a staffed inbox.
    admin-notifications: ${MAIL_ADMIN_NOTIFICATIONS:100sky.ladakh@gmail.com}
    # Replies go here rather than to the no-reply `from` address — several of
    # the templates invite a reply, so it has to reach someone.
    reply-to: ${MAIL_REPLY_TO:100sky.ladakh@gmail.com}
    # Footer contact line and postal address.
    support-email: ${MAIL_SUPPORT_EMAIL:100sky.ladakh@gmail.com}
    company-address: ${MAIL_COMPANY_ADDRESS:}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lock-duration-minutes: ${ACCOUNT_LOCK_DURATION_MINUTES:15}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:60}
  email-verification:
    token-expiration-hours: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_HOURS:24}
  booking:
    # A child's share of the adult package price. Uniform across packages for
    # now — see PackagePricing for what changes if that stops being true.
    child-price-percent: ${CHILD_PRICE_PERCENT:70}
  storage:
    # local | s3 | cloudinary. Only `local` has an implementation today; the
    # other two are what StorageService exists to make addable. See the
    # interface's javadoc for what adding one involves.
    provider: ${STORAGE_PROVIDER:local}
    # Absolute, because the browser loading these images is on a different
    # origin than the API, and because S3/Cloudinary return absolute URLs too —
    # keeping the shape the same means switching provider doesn't change how
    # stored URLs are consumed. A real deployment points this at its API host
    # or a CDN in front of the bucket.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/uploads}
    local:
      directory: ${STORAGE_LOCAL_DIR:./uploads}
      # Servlet path uploads are served from, below the /api context path.
      # Must correspond to the tail of public-base-url above: that one builds
      # the URLs written to the database, this one is where they're answered.
      serve-path: ${STORAGE_SERVE_PATH:/uploads}
    image:
      # Longest side of the stored image; anything larger is scaled down.
      max-dimension: ${IMAGE_MAX_DIMENSION:2400}
      thumbnail-dimension: ${IMAGE_THUMBNAIL_DIMENSION:400}
      # JPEG encoder quality, 0..1. 0.82 is a common sweet spot for photos.
      jpeg-quality: ${IMAGE_JPEG_QUALITY:0.82}
      max-upload-bytes: ${IMAGE_MAX_UPLOAD_BYTES:10485760}

springdoc:
  # Publicly readable documentation of every endpoint is a gift to anyone
  # probing the API. Left on by default because that is what makes it useful
  # during development, and turned off in the production compose/profile —
  # generate the spec in CI if a published contract is wanted.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    # Alphabetical rather than declaration order, which is otherwise whatever
    # order the classpath scan happened to produce.
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        # prometheus is scraped by the monitoring stack; the rest are operator
        # tools. Everything here is read-only — no env, no heapdump, no loggers
        # mutation endpoint, because this port is not always as private as
        # people assume.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Kubernetes-style split. Liveness answers "is this process wedged"
      # (restart it); readiness answers "can it serve traffic right now"
      # (take it out of rotation). Conflating them restarts a pod that was
      # only waiting on a slow dependency.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: tourpackage-api
  observations:
    key-values:
      application: tourpackage-api

logging:
  level:
    root: INFO
    com.tourpackage.api: ${LOG_LEVEL:INFO}
    # One line per request, from AccessLogFilter.
    access: INFO
  pattern:
    # The request id is what makes concurrent requests separable in a log, so it
    # is in every line rather than only the access log. `-` when absent, which is
    # anything running outside a request (startup, scheduled work).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:--}] %logger{36} - %msg%n"
