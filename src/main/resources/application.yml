spring:
  application:
    name: tourpackage-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourpackage}
    username: ${DB_USERNAME:tourpackage}
    password: ${DB_PASSWORD:tourpackage}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # Spring's defaults are 1MB per file / 10MB per request, which would
      # reject uploads before ImageProcessor's own limit ever ran. Kept a
      # little above app.storage.image.max-upload-bytes so the app's error
      # message is what the user sees, not a container-level failure.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:120MB}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
  mail:
    from: ${MAIL_FROM:no-reply@tourpackage.com}
    # Where "a booking came in" notifications go. Separate from `from` so a
    # real deployment can route them to a staffed inbox.
    admin-notifications: ${MAIL_ADMIN_NOTIFICATIONS:bookings@tourpackage.com}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lock-duration-minutes: ${ACCOUNT_LOCK_DURATION_MINUTES:15}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:60}
  email-verification:
    token-expiration-hours: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_HOURS:24}
  booking:
    # A child's share of the adult package price. Uniform across packages for
    # now — see PackagePricing for what changes if that stops being true.
    child-price-percent: ${CHILD_PRICE_PERCENT:70}
  storage:
    # local | s3 | cloudinary. Only `local` has an implementation today; the
    # other two are what StorageService exists to make addable. See the
    # interface's javadoc for what adding one involves.
    provider: ${STORAGE_PROVIDER:local}
    # Absolute, because the browser loading these images is on a different
    # origin than the API, and because S3/Cloudinary return absolute URLs too —
    # keeping the shape the same means switching provider doesn't change how
    # stored URLs are consumed. A real deployment points this at its API host
    # or a CDN in front of the bucket.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/uploads}
    local:
      directory: ${STORAGE_LOCAL_DIR:./uploads}
      # Servlet path uploads are served from, below the /api context path.
      # Must correspond to the tail of public-base-url above: that one builds
      # the URLs written to the database, this one is where they're answered.
      serve-path: ${STORAGE_SERVE_PATH:/uploads}
    image:
      # Longest side of the stored image; anything larger is scaled down.
      max-dimension: ${IMAGE_MAX_DIMENSION:2400}
      thumbnail-dimension: ${IMAGE_THUMBNAIL_DIMENSION:400}
      # JPEG encoder quality, 0..1. 0.82 is a common sweet spot for photos.
      jpeg-quality: ${IMAGE_JPEG_QUALITY:0.82}
      max-upload-bytes: ${IMAGE_MAX_UPLOAD_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.tourpackage.api: ${LOG_LEVEL:DEBUG}
