<h1 style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold;color:#18181b;">
  New newsletter subscriber
</h1>

<p style="margin:0 0 24px 0;">
  {{email}} {{subscriptionKind}} the newsletter.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;font-size:14px;">
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;width:35%;">Email</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;"><a href="mailto:{{email}}" style="color:#18181b;">{{email}}</a></td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Subscribed</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{subscribedAt}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Total active</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{totalActive}}</td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0 0;">
  <tr>
    <td style="background-color:#18181b;border-radius:8px;">
      <a href="{{adminUrl}}" style="display:inline-block;padding:12px 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">View subscribers</a>
    </td>
  </tr>
</table>
