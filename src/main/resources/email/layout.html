<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{subject}}</title>
</head>
<!--
  Every style here is inline and the layout is nested tables, because email
  clients are not browsers: Outlook renders through Word, Gmail strips <style>
  blocks on forwarded mail, and neither flexbox nor grid can be relied on. The
  600px cap is the long-standing safe width for desktop preview panes.
-->
<body style="margin:0;padding:0;background-color:#f4f4f5;">

  <!-- Preheader: the grey line clients show next to the subject. Hidden in the
       body itself, otherwise it reads as a duplicated first sentence. -->
  <div id="preheader" style="display:none;font-size:1px;color:#f4f4f5;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {{preheader}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;">

          <tr>
            <td style="background-color:#18181b;padding:24px 32px;">
              <a href="{{siteUrl}}" style="color:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:bold;text-decoration:none;letter-spacing:-0.3px;">{{brandName}}</a>
            </td>
          </tr>

          <tr>
            <td style="padding:32px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#3f3f46;">
              {{{body}}}
            </td>
          </tr>

          <tr>
            <td style="background-color:#fafafa;border-top:1px solid #e4e4e7;padding:24px 32px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#71717a;">
              <p style="margin:0 0 8px 0;">{{brandName}}{{footerAddress}}</p>
              <p style="margin:0;">
                Questions? Email us at <a href="mailto:{{supportEmail}}" style="color:#18181b;">{{supportEmail}}</a>.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
