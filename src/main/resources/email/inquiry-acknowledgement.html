<h1 style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold;color:#18181b;">
  Thanks for getting in touch, {{name}}
</h1>

<p style="margin:0 0 16px 0;">
  We've received your message and someone from the team will reply shortly — usually within one
  working day. There's no need to send it again.
</p>

<h2 style="margin:24px 0 8px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#18181b;">What you sent us</h2>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="border-left:3px solid #e4e4e7;padding:4px 0 4px 16px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#52525b;">
      {{{message}}}
    </td>
  </tr>
</table>

<p style="margin:24px 0 0 0;font-size:13px;color:#71717a;">
  This is an automatic confirmation — but replying to it will reach us just fine.
</p>
