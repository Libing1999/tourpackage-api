<h1 style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold;color:#18181b;">
  New enquiry from {{name}}
</h1>

<p style="margin:0 0 24px 0;">Someone submitted the contact form. Their details are below.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;font-size:14px;">
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;width:35%;">Name</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{name}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Email</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;"><a href="mailto:{{email}}" style="color:#18181b;">{{email}}</a></td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Phone</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{phone}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Travel date</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{travelDate}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Party size</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{partySize}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">About</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{about}}</td>
  </tr>
</table>

<h2 style="margin:24px 0 8px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#18181b;">Message</h2>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="border-left:3px solid #e4e4e7;padding:4px 0 4px 16px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#52525b;">
      {{{message}}}
    </td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0 0;">
  <tr>
    <td style="background-color:#18181b;border-radius:8px;">
      <a href="mailto:{{email}}" style="display:inline-block;padding:12px 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Reply to {{name}}</a>
    </td>
  </tr>
</table>
