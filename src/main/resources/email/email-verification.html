<h1 style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold;color:#18181b;">
  Verify your email address
</h1>

<p style="margin:0 0 16px 0;">Hi {{fullName}},</p>

<p style="margin:0 0 24px 0;">
  Confirm this address to activate your {{brandName}} admin account. This link expires in
  {{expiryHours}} hours.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td style="background-color:#18181b;border-radius:8px;">
      <a href="{{link}}" style="display:inline-block;padding:12px 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Verify your email</a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:13px;color:#71717a;">
  If the button doesn't work, paste this into your browser:<br />
  <span style="color:#52525b;word-break:break-all;">{{link}}</span>
</p>
