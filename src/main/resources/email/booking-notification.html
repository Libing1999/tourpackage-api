<h1 style="margin:0 0 16px 0;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:bold;color:#18181b;">
  New {{bookingType}} booking — {{bookingNumber}}
</h1>

<p style="margin:0 0 16px 0;">
  A booking came in through the site and is <strong style="color:#18181b;">{{status}}</strong>, waiting on review.
</p>

{{{detailsTable}}}

<h2 style="margin:24px 0 8px 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#18181b;">Guest</h2>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;font-size:14px;">
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;width:35%;">Name</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{guestName}}</td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Email</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;"><a href="mailto:{{guestEmail}}" style="color:#18181b;">{{guestEmail}}</a></td>
  </tr>
  <tr>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;background-color:#fafafa;color:#71717a;">Phone</td>
    <td style="padding:8px 12px;border:1px solid #e4e4e7;color:#18181b;">{{guestPhone}}</td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0 0;">
  <tr>
    <td style="background-color:#18181b;border-radius:8px;">
      <a href="{{adminUrl}}" style="display:inline-block;padding:12px 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Open in dashboard</a>
    </td>
  </tr>
</table>
