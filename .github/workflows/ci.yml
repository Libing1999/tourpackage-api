name: API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the older run's result is
# about to be irrelevant, and CI minutes are not free.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL, because the schema uses pg_trgm indexes, generated
      # tsvector columns and trigram operators. An in-memory substitute would
      # make the integration tests pass while proving nothing about production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tourpackage_test
          POSTGRES_USER: tourpackage
          POSTGRES_PASSWORD: tourpackage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tourpackage -d tourpackage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -B --no-transfer-progress compile

      - name: Test
        run: ./mvnw -B --no-transfer-progress verify
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: tourpackage_test
          TEST_DB_USERNAME: tourpackage
          TEST_DB_PASSWORD: tourpackage

      # Uploaded on failure too — a red build is exactly when the reports are
      # wanted, and by then the workspace is gone.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tourpackage-api-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every run to prove the Dockerfile still works, but only pushed
      # from main — a pull request must not publish an image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tourpackage-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Reports known CVEs in the dependency tree. Advisory rather than
      # blocking: a transitive CVE with no fix available should not stop a
      # deploy that has nothing to do with it.
      - name: Check for vulnerable dependencies
        run: ./mvnw -B --no-transfer-progress dependency:tree
        continue-on-error: true
